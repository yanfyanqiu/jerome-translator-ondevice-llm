name: APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apk-build.yml"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles("**/gradle-wrapper.properties") }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Download Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          WRAPPER_URL="https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "$WRAPPER_URL"
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew -o gradlew
          chmod +x gradlew

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

      - name: Configure gradle.properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Find APK
        id: find-apk
        run: |
          set -e
          APK=$(find app/build -name "*.apk" 2>/dev/null | head -1)
          SHA=$(sha256sum "$APK" | cut -d" " -f1)
          SIZE=$(stat -c%s "$APK")
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          echo "APK_SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "APK_INFO: sha256=$SHA size=$SIZE"

      - name: Upload APK to GitHub Release
        run: |
          set -e
          APK_PATH="${{ steps.find-apk.outputs.APK_PATH }}"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          # Delete existing asset with the same name (if any) so re-upload always works
          ASSET_ID=$(curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/yanfyanqiu/jerome-translator-ondevice-llm/releases/368985663/assets" \
            | python3 -c "import sys,json; a=json.load(sys.stdin); print(next((x['id'] for x in a if x['name']=='jerome-debug.apk'),''))")
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting existing asset $ASSET_ID"
            curl -fsSL -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/yanfyanqiu/jerome-translator-ondevice-llm/releases/assets/$ASSET_ID"
          fi
          # Upload fresh asset (curl -f fails the step on any HTTP error)
          curl -f -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK_PATH" \
            "https://uploads.github.com/repos/yanfyanqiu/jerome-translator-ondevice-llm/releases/368985663/assets?name=jerome-debug.apk&label=Jerome+Translator+v0.1.0"
          echo "Upload OK sha256=${{ steps.find-apk.outputs.APK_SHA256 }} size=${{ steps.find-apk.outputs.APK_SIZE }}"
