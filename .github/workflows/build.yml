name: build-jerome-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/build.gradle.kts'
      - 'app/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install NDK + platforms + build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Add local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          ndk.dir=$ANDROID_HOME/ndk/26.1.10909125
          EOF

      - name: Configure gradle properties
        run: |
          cat >> gradle.properties <<EOF
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=34
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Upload build output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 1

      - name: List output APK
        if: success()
        run: |
          ls -la app/build/outputs/apk/debug/
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "APK_PATH=$APK" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jerome-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
