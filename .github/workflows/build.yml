name: build-jerome-apk

on:
  workflow_dispatch: ~

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install NDK + platforms + build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1"

      - name: Download gradle wrapper
        run: |
          WRAPPER_URL="https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "$WRAPPER_URL"
          cat > gradlew << 'WRAPPER_SCRIPT'
          #!/bin/sh
          APP_BASE_NAME=$(basename "$0")
          CLASSPATH=$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar
          exec java "-Xmx64m" "-Xms64m" $JAVA_OPTS $GRADLE_OPTS \
            "-Dorg.gradle.appname=$APP_BASE_NAME" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          WRAPPER_SCRIPT
          chmod +x gradlew

      - name: Add local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

      - name: Configure gradle properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Find APK
        id: find-apk
        run: |
          set -e
          APK=$(find app/build -name '*.apk' 2>/dev/null | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          echo "APK_SHA256=$SHA" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "APK_INFO: sha256=$SHA size=$SIZE"

      - name: Upload APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.find-apk.outputs.APK_PATH }}
        run: |
          python3 -c "
import json, urllib.request, urllib.error, os, sys
apk_path = os.environ['APK_PATH']
gh_token = os.environ['GH_TOKEN']
repo = 'yanfyanqiu/jerome-translator-ondevice-llm'
release_id = 368985663
with open(apk_path, 'rb') as f:
    data = f.read()
print('APK size: ' + str(len(data)) + ' bytes')
url = 'https://uploads.github.com/repos/' + repo + '/releases/' + str(release_id) + '/assets?name=jerome-debug.apk'
req = urllib.request.Request(url, data=data, headers={'Authorization': 'Bearer ' + gh_token, 'Content-Type': 'application/octet-stream', 'Accept': 'application/vnd.github+json'}, method='POST')
try:
    with urllib.request.urlopen(req, timeout=120) as resp:
        result = json.loads(resp.read())
        print('SUCCESS: ' + result.get('browser_download_url',''))
except urllib.error.HTTPError as e:
    body = e.read().decode('utf-8', errors='replace')
    print('HTTP ' + str(e.code) + ' error: ' + body[:500])
    sys.exit(1)
"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 1
