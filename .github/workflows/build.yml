name: build-jerome-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/build.gradle.kts'
      - 'app/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install NDK + platforms + build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Download gradle wrapper
        run: |
          WRAPPER_URL="https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "$WRAPPER_URL"
          cat > gradlew << 'WRAPPER_SCRIPT'
          #!/bin/sh
          APP_NAME="Gradle"
          APP_BASE_NAME=`basename "$0"`
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          CLASSPATH=`dirname "$0"`/gradle/wrapper/gradle-wrapper.jar
          JAVACMD="java"
          exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS             "-Dorg.gradle.appname=$APP_BASE_NAME"             -classpath "$CLASSPATH"             org.gradle.wrapper.GradleWrapperMain "$@"
          WRAPPER_SCRIPT
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/gradle-wrapper.jar
        shell: bash

      - name: Add local.properties
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s\n' "$ANDROID_HOME" "$ANDROID_HOME/ndk/26.1.10909125" > local.properties
        shell: bash

      - name: Configure gradle properties
        run: |
          printf 'android.useAndroidX=true\nandroid.suppressUnsupportedCompileSdk=34\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' >> gradle.properties
        shell: bash

      - name: List available build variants
        run: |
          chmod +x gradlew
          ./gradlew tasks --group=build 2>&1 | grep -E "assemble|build" | head -30
        shell: bash

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon 2>&1
          echo "GRADLE_EXIT=$?" >> $GITHUB_ENV
        shell: bash

      - name: Upload build log
        if: always()
        run: |
          echo "GRADLE_EXIT=${{ env.GRADLE_EXIT }}" >> build-status.txt
          cat build-status.txt
        shell: bash
        continue-on-error: true

      - name: Upload build output artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-output-log
          path: build-status.txt
          retention-days: 1

      - name: List output APK
        run: |
          ls -la app/build/outputs/apk/debug/ 2>&1 || echo "DEBUG_DIR_NOT_FOUND"
          ls -la app/build/outputs/apk/ 2>&1 || echo "APK_DIR_NOT_FOUND"
          echo "APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || echo '')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: jerome-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
