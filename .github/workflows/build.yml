name: build-jerome-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/build.gradle.kts'
      - 'app/src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install NDK + platforms + build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager             "platforms;android-34"             "build-tools;34.0.0"             "ndk;25.1.8937393"             "cmake;3.22.1"

      - name: Download gradle wrapper
        run: |
          WRAPPER_URL="https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "$WRAPPER_URL"
          cat > gradlew << 'WRAPPER_SCRIPT'
          #!/bin/sh
          APP_BASE_NAME=$(basename "$0")
          CLASSPATH=$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar
          exec java "-Xmx64m" "-Xms64m" $JAVA_OPTS $GRADLE_OPTS             "-Dorg.gradle.appname=$APP_BASE_NAME"             -classpath "$CLASSPATH"             org.gradle.wrapper.GradleWrapperMain "$@"
          WRAPPER_SCRIPT
          chmod +x gradlew

      - name: Add local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties

      - name: Configure gradle properties
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log
          echo "GRADLE_EXIT=$?" >> build.log

      - name: Find APK
        run: |
          set +e
          APK=$(find app/build -name '*.apk' 2>/dev/null | head -1)
          echo "APK_PATH=$APK"
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT
          echo "APK_FOUND=$(test -n "$APK" && echo yes || echo no)" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: success() && env.APK_FOUND == 'yes'
        uses: actions/upload-artifact@v5
        with:
          name: jerome-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 1
